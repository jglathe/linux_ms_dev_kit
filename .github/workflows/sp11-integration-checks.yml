# SPDX-License-Identifier: GPL-2.0-only

name: Surface Pro 11 integration checks

on:
  pull_request:
    branches:
      - sp11/integration-7.2-rc
      - sp11/integration-7.2.x
  push:
    branches:
      - sp11/integration-7.2-rc
      - sp11/integration-7.2.x
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sp11-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate integration delta
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Bound history while retaining room for the integration branch to
          # advance from the immutable base. The validator fails closed if the
          # base ever falls outside this window.
          fetch-depth: 256
          persist-credentials: false
          sparse-checkout: |
            .github
            scripts/checkpatch.pl
          sparse-checkout-cone-mode: false

      - name: Validate the Surface Pro 11 integration delta
        run: .github/scripts/check-sp11-integration.sh
