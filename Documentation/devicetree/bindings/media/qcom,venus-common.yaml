%YAML 1.2
---
$id: http://devicetree.org/schemas/media/qcom,venus-common.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm SoC Venus Video Encode and Decode Accelerators Common Properties

maintainers:
  - Stanimir Varbanov <stanimir.k.varbanov@gmail.com>
  - Vikash Garodia <quic_vgarodia@quicinc.com>

description: |
  The Venus IP is a video encode and decode accelerator present
  on Qualcomm platforms

properties:
  reg:
    maxItems: 1

  clocks:
    minItems: 3
    maxItems: 7

  clock-names:
    minItems: 3
    maxItems: 7

  firmware-name:
    maxItems: 1

  interrupts:
    maxItems: 1

  iommus:
    minItems: 1
    maxItems: 20

  memory-region:
    maxItems: 1

  power-domains:
    minItems: 1
    maxItems: 4

  power-domain-names:
    minItems: 1
    maxItems: 4

  '#address-cells':
    const: 1

  '#size-cells':
    const: 1

  dma-ranges:
    maxItems: 1

  non-pixel:
    type: object
    description:
      Context bank for VPU non-pixel buffers, including compressed and internal buffers.
    additionalProperties: false

    properties:
      iommus:
        maxItems: 1
      iommu-ranges:
        maxItems: 1
    required:
      - iommus
      - iommu-ranges

  pixel:
    type: object
    description:
      Context bank for VPU pixel buffers containing uncompressed video data.
    additionalProperties: false

    properties:
      iommus:
        maxItems: 1
    required:
      - iommus

  video-firmware:
    type: object
    description:
      Context bank for the VPU firmware processing domain.
    additionalProperties: false

    properties:
      iommus:
        maxItems: 1
    required:
      - iommus

  secure-non-pixel:
    type: object
    description:
      Context bank for VPU secure non-pixel buffers.
    additionalProperties: false

    properties:
      iommus:
        maxItems: 1
      iommu-ranges:
        maxItems: 1
    required:
      - iommus
      - iommu-ranges

  secure-pixel:
    type: object
    description:
      Context bank for VPU secure pixel buffers containing uncompressed video data.
    additionalProperties: false

    properties:
      iommus:
        maxItems: 1
    required:
      - iommus

  secure-bitstream:
    type: object
    description:
      Context bank for VPU secure bitstream buffers containing compressed video data.
    additionalProperties: false

    properties:
      iommus:
        maxItems: 1
    required:
      - iommus

required:
  - reg
  - clocks
  - clock-names
  - interrupts
  - memory-region
  - power-domains

oneOf:
  - required:
      - iommus
  - required:
      - '#address-cells'
      - '#size-cells'
      - dma-ranges
      - non-pixel
      - pixel

additionalProperties: true
